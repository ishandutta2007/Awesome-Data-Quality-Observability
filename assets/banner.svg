<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Flow Line Gradient -->
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #334155; stroke-opacity: 0.25; stroke-width: 1; }
    .pulse-circle {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    .flow-wave {
      stroke-dasharray: 12 8;
      animation: dash 25s linear infinite;
    }
    .flow-wave-rev {
      stroke-dasharray: 8 6;
      animation: dashRev 20s linear infinite;
    }
    .orb-float-1 {
      animation: floatOrb1 7s ease-in-out infinite alternate;
    }
    .orb-float-2 {
      animation: floatOrb2 9s ease-in-out infinite alternate;
    }
    .pill-glow {
      animation: pillPulse 5s ease-in-out infinite alternate;
    }
    @keyframes dash {
      to { stroke-dashoffset: -1000; }
    }
    @keyframes dashRev {
      to { stroke-dashoffset: 1000; }
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.35; }
      100% { transform: scale(1.08); opacity: 0.75; }
    }
    @keyframes floatOrb1 {
      0% { transform: translateY(0px) translateX(0px); }
      100% { transform: translateY(-18px) translateX(12px); }
    }
    @keyframes floatOrb2 {
      0% { transform: translateY(0px) translateX(0px); }
      100% { transform: translateY(16px) translateX(-15px); }
    }
    @keyframes pillPulse {
      0% { opacity: 0.75; }
      100% { opacity: 1; filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.6)); }
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Matrix Grid -->
  <g class="grid-layer">
    <line x1="0" y1="68" x2="1200" y2="68" class="grid-line" />
    <line x1="0" y1="136" x2="1200" y2="136" class="grid-line" />
    <line x1="0" y1="204" x2="1200" y2="204" class="grid-line" />
    <line x1="0" y1="272" x2="1200" y2="272" class="grid-line" />
    <line x1="150" y1="0" x2="150" y2="340" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="340" class="grid-line" />
    <line x1="450" y1="0" x2="450" y2="340" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="340" class="grid-line" />
    <line x1="750" y1="0" x2="750" y2="340" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="340" class="grid-line" />
    <line x1="1050" y1="0" x2="1050" y2="340" class="grid-line" />
  </g>

  <!-- Background Dynamic Flow Curves (Strictly in Background) -->
  <g opacity="0.6">
    <path class="flow-wave" d="M-50,290 C250,330 350,230 650,270 C950,310 1050,230 1250,280" fill="none" stroke="url(#flowGrad)" stroke-width="2.5" />
    <path class="flow-wave-rev" d="M-50,60 C280,10 420,110 720,50 C1020,-10 1120,90 1250,40" fill="none" stroke="url(#flowGrad)" stroke-width="2" />
    <path class="flow-wave" d="M-50,180 C200,240 400,140 700,210 C1000,270 1100,160 1250,200" fill="none" stroke="#818cf8" stroke-opacity="0.25" stroke-width="1.5" />
  </g>

  <!-- Background Glowing Orbs (Soft, Ambient, Behind Text) -->
  <g opacity="0.45" filter="url(#glow)">
    <circle class="orb-float-1" cx="220" cy="90" r="70" fill="#38bdf8" opacity="0.25" />
    <circle class="orb-float-2" cx="1020" cy="180" r="90" fill="#c084fc" opacity="0.25" />
    <circle class="pulse-circle" cx="600" cy="170" r="110" fill="#818cf8" opacity="0.15" />
  </g>

  <!-- Foreground Content: Header Tag / Pill -->
  <g class="pill-glow" transform="translate(425, 32)">
    <rect width="350" height="34" rx="17" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="20" cy="17" r="5" fill="#38bdf8" />
    <text x="34" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">ENTERPRISE &amp; OPEN-SOURCE ECOSYSTEM</text>
  </g>

  <!-- Foreground Content: Main Title (Crisp, High Contrast, Guaranteed Foreground) -->
  <text x="600" y="128" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5" filter="url(#subtleGlow)">
    Awesome Data Quality &amp; Observability
  </text>
  
  <text x="600" y="130" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" fill="url(#primaryGrad)" letter-spacing="-0.5">
    Awesome Data Quality &amp; Observability
  </text>

  <!-- Foreground Content: Subtitle -->
  <text x="600" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#94a3b8" letter-spacing="0.3">
    Automated Anomaly Detection &bull; Declarative Testing &bull; Data Contracts &bull; Pipeline Reliability
  </text>

  <!-- Dynamic Feature Badges / Category Cards in Foreground (Lower Section) -->
  <g transform="translate(140, 215)">
    <!-- Pill 1: Anomaly Detection -->
    <g transform="translate(0, 0)">
      <rect width="210" height="54" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="28" cy="27" r="8" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2" />
      <text x="48" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Anomaly Detection</text>
      <text x="48" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Unsupervised ML &amp; Drift</text>
    </g>

    <!-- Pill 2: Data Contracts & Testing -->
    <g transform="translate(235, 0)">
      <rect width="210" height="54" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="28" cy="27" r="8" fill="#818cf8" fill-opacity="0.2" stroke="#818cf8" stroke-width="2" />
      <text x="48" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Declarative Testing</text>
      <text x="48" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">GX, SodaCL &amp; dbt Tests</text>
    </g>

    <!-- Pill 3: Lineage & Tracing -->
    <g transform="translate(470, 0)">
      <rect width="210" height="54" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="28" cy="27" r="8" fill="#c084fc" fill-opacity="0.2" stroke="#c084fc" stroke-width="2" />
      <text x="48" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Lineage &amp; RCA</text>
      <text x="48" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Column-Level &amp; Tracing</text>
    </g>

    <!-- Pill 4: Agentic AI Integration -->
    <g transform="translate(705, 0)">
      <rect width="210" height="54" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="28" cy="27" r="8" fill="#34d399" fill-opacity="0.2" stroke="#34d399" stroke-width="2" />
      <text x="48" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Agentic AI &amp; MCP</text>
      <text x="48" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Claude, Bedrock &amp; Copilots</text>
    </g>
  </g>

  <!-- Clean Bottom Accent Line -->
  <rect x="0" y="336" width="1200" height="4" fill="url(#primaryGrad)" />
</svg>
